<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#075e62">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
<title>لوحة التحكم | الكواكب</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body">

<!-- شاشة الدخول -->
<section class="login-screen" id="loginScreen" hidden>
  <form class="login-card" id="loginForm" autocomplete="on" novalidate>
    <img class="login-logo" src="assets/school-logo.svg" alt="شعار رمزي للمدرسة">
    <h1>لوحة التحكم</h1>
    <p class="muted">البوابة المدرسية · الكواكب</p>
    <label>اسم المستخدم
      <input id="loginUser" name="username" autocomplete="username" required maxlength="120" dir="ltr">
    </label>
    <label>كلمة المرور
      <input id="loginPass" name="password" type="password" autocomplete="current-password" required maxlength="200" dir="ltr">
    </label>
    <div class="form-msg" id="loginMsg" role="alert"></div>
    <button class="btn primary block" id="loginBtn" type="submit">دخول</button>
    <a class="back-link" href="index.html">← العودة إلى البوابة</a>
  </form>
</section>

<!-- تنبيه الإعداد -->
<section class="login-screen" id="setupScreen" hidden>
  <div class="login-card">
    <img class="login-logo" src="assets/school-logo.svg" alt="شعار رمزي للمدرسة">
    <h1>لم يتم ربط قاعدة البيانات بعد</h1>
    <p class="muted">أدخل قيم <code>SUPABASE_URL</code> و <code>SUPABASE_ANON_KEY</code> في ملف <code>config.js</code> ثم أعد تحميل الصفحة. التفاصيل في ملف README.</p>
    <a class="back-link" href="index.html">← العودة إلى البوابة</a>
  </div>
</section>

<!-- التطبيق -->
<div class="admin-app" id="adminApp" hidden>
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="index.html" target="_blank" rel="noopener"><img class="brand-logo" src="assets/school-logo.svg" alt=""><span><b>الكواكب</b><small>لوحة التحكم</small></span></a>
    <nav class="side-nav" id="sideNav">
      <button data-view="overview">الرئيسية</button>
      <button data-view="records">سجل الأعمال</button>
      <button data-view="files">الملفات والشواهد</button>
      <button data-view="sections">مسارات العمل</button>
      <button data-view="team">فريق المدرسة</button>
      <button data-view="users" data-admin>المستخدمون والصلاحيات</button>
      <button data-view="settings" data-admin>الإعدادات</button>
      <button data-view="log" data-admin>سجل النشاط</button>
      <button data-view="account">حسابي</button>
    </nav>
    <div class="side-user">
      <b id="meName"></b><small id="meRole"></small>
      <button class="btn ghost-dark small-btn" id="logoutBtn" type="button">تسجيل الخروج</button>
    </div>
  </aside>
  <main class="admin-main">
    <header class="admin-top">
      <button class="menu-toggle" id="sideToggle" type="button" aria-label="القائمة">☰</button>
      <h1 id="viewTitle"></h1>
      <div id="viewActions" class="top-actions"></div>
    </header>
    <div id="view" class="view"></div>
  </main>
</div>

<dialog id="modal" class="modal"><div id="modalBody"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
